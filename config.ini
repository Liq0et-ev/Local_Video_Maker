# Local Video Maker settings.
# Relative paths are resolved against the folder that contains this file.
# Windows paths may use forward slashes or backslashes, e.g.  C:\Videos\Raw   or   C:/Videos/Raw
# Text after " #" on a line is a comment.

[paths]
input_dir  = input        # folder with the long source videos
music_dir  = music        # folder with background tracks (.mp3 / .wav)
output_dir = output       # finished Shorts are saved in output/<video name>/
work_dir   = work         # temporary files (cleaned automatically)

[pipeline]
# highlight = ONE short built from the most dynamic moments of the video
# slice     = the whole video cut into several sequential shorts
mode = highlight

# --- highlight mode ---
variant = heuristic       # heuristic | surprisal (calm, uniform footage) | attention (mixed content)
target_seconds = 60       # wanted length of the highlight
threshold = 1.5           # SENSITIVITY: lower = more and longer "action" segments, higher = only the sharpest peaks
buffer_seconds = 5        # safety buffer after each event
merge_gap_seconds = 3     # merge segments closer than this

# --- slice mode ---
min_clip_seconds = 45
max_clip_seconds = 60
max_clips = 10            # cap on shorts per source video

# 9:16 reframing: blur (whole frame over blurred background) | crop (fill the screen) | off
vertical = blur

[highlight]
# How the program decides what is "dynamic" and how it assembles the highlight.
# The four weights are relative (they are normalised); 0 switches a signal off.
weight_motion = 0.30          # how much the picture changes
weight_flow = 0.30            # how much things move on screen
weight_loudness = 0.20        # sound level (speech, crowd)
weight_audio_change = 0.20    # sudden sound changes (hits, cheers, music drops)

analysis_window_seconds = 30  # what counts as "normal" is judged inside this window
min_activity_seconds = 1.0    # activity shorter than this is ignored
smoothing_window = 15         # odd number >= 5; bigger = calmer curve, fewer jumps
median_seconds = 3.0          # bigger = fewer, longer, steadier segments
sample_fps = 2.0              # analysis frames per second (higher = slower, more precise)

# Fewer, longer segments mean fewer jerks between shots:
min_segment_seconds = 4.0     # drop segments shorter than this (removes flicker)
max_segments = 6              # at most N segments in one highlight (0 = unlimited)
selection = best              # best = strongest segments first | proportional = trim every segment
fill_to_target = true         # add context around the moments when the total is below target_seconds

[cuts]
# Cuts and transitions between the highlight segments.
snap_seconds = 1.0            # move every cut to the nearest pause within +-N s (0 = off): no cut mid-word
audio_fade_ms = 30            # tiny fade at each cut: no clicks

# ask  = the program analyses every join, PROPOSES a transition with the reason and waits for your OK
#        (needs a terminal; otherwise it behaves like auto)
# auto = same analysis, applied without asking
# or one fixed transition for every join:
#   cut fade dissolve blur fadeblack fadewhite wipeleft wiperight wipeup pushup pushdown pushleft
#   pushright zoom pixelize diagonal blinds reveal radial circle
transition = ask
transition_style = auto       # tempo of the effects: auto | calm | neutral | dynamic
transition_seconds = auto     # auto = 0.15-0.9 s chosen per join, or a number such as 0.4

[video]
# draft = fast and small | standard | high = default | max = best quality, slowest
quality = high
crf = auto                    # auto = from quality; or 0-51 (lower = better quality, bigger file)
preset = auto                 # auto = from quality; ultrafast ... medium ... veryslow
fps = source                  # source = keep the original frame rate (no judder); or a number such as 30
sharpen = 0.0                 # 0 = off, 0.3-0.8 gentle, up to 2
audio_bitrate_kbps = 192

[subtitles]
enabled = true
language = auto           # auto | en | ru
# viral_yellow | neon_blue | fire_red | minimal_white | gradient_purple
brand_kit = viral_yellow
# tiny | base | small | medium | large  (bigger = more accurate and slower)
whisper_model = medium

[music]
enabled = true
volume = 0.2              # 0.0 (silent) .. 1.0 (same as the speech)
